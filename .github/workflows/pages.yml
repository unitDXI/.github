# Publishes the site/ folder to GitHub Pages exactly as it is in the repository.
# There is no build step: no generator, no npm, no install. The workflow only uploads files.
#
# One-time setup (repository Settings → Pages):
#   Source: GitHub Actions
#   Custom domain: unit511.fairytale.ai, then tick "Enforce HTTPS" once the certificate is issued.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
